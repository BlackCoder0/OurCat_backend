spring:
  datasource:
    url: jdbc:h2:mem:ourcat;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create
  flyway:
    enabled: false
ourcat:
  jwt:
    # Local development only; never reuse this key outside the dev profile.
    secret: ourcat-dev-only-jwt-signing-key-do-not-use-in-production-2026
  ai:
    enabled: false
