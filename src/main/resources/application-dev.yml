# Run without MySQL: spring.profiles.active=dev
spring:
  datasource:
    url: jdbc:h2:mem:ourcat;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER_CASE=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create
  flyway:
    enabled: false
