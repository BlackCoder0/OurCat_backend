spring:
  application:
    name: ourcat-backend
  datasource:
    url: jdbc:mysql://localhost:3306/ourcat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Placeholders - replace in production
ourcat:
  jwt:
    secret: ${JWT_SECRET:ourcat-jwt-secret-change-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    bucket: ${OSS_BUCKET:ourcat}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  qweather:
    api-key: ${QWEATHER_API_KEY:}
  amap:
    key: ${AMAP_KEY:}

logging:
  level:
    root: INFO
    com.ourcat: DEBUG
