meta:
  profile: engineering-review
  theme: tech-blue
  layout: horizontal
  routing: orthogonal
  canvas: auto
  title: 广场与救助联动
  description: 广播与活动可从不同入口创建，任务执行保留日志，结果由手动标记后同步。
nodes:
  - id: square
    label: "救助类广场广播\n公开现场信息"
    type: service
    size: xl
    position: { x: 32, y: 32 }
    style: { fontSize: 16 }
  - id: activity
    label: "关联救助活动\n同一事件的处理记录"
    type: service
    size: xl
    position: { x: 352, y: 32 }
    style: { fontSize: 16 }
  - id: task
    label: "组织成员接收任务\n管理员分配 / 成员申领"
    type: service
    size: xl
    position: { x: 672, y: 32 }
    style: { fontSize: 16 }
  - id: logs
    label: "执行任务\n填写日志与完成说明"
    type: service
    size: xl
    position: { x: 672, y: 240 }
    style: { fontSize: 16 }
  - id: resolve
    label: "处理结束后\n手动标记广播已解决"
    type: service
    size: xl
    position: { x: 352, y: 240 }
    style: { fontSize: 16 }
  - id: feedback
    label: "同步活动与相关任务\n发送站内消息"
    type: service
    size: xl
    position: { x: 32, y: 240 }
    style: { fontSize: 16 }
edges:
  - from: square
    to: activity
    type: primary
    label: 创建活动
    style: { exitX: 1, exitY: 0.3, entryX: 0, entryY: 0.3 }
  - from: activity
    to: square
    type: primary
    label: 生成广播
    style: { exitX: 0, exitY: 0.8, entryX: 1, entryY: 0.8 }
  - from: activity
    to: task
    type: primary
    style: { exitX: 1, exitY: 0.5, entryX: 0, entryY: 0.5 }
  - from: task
    to: logs
    type: primary
    style: { exitX: 0.5, exitY: 1, entryX: 0.5, entryY: 0 }
  - from: logs
    to: resolve
    type: primary
    style: { exitX: 0, exitY: 0.5, entryX: 1, entryY: 0.5 }
  - from: resolve
    to: feedback
    type: primary
    style: { exitX: 0, exitY: 0.5, entryX: 1, entryY: 0.5 }
